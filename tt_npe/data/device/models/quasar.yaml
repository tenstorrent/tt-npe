# PLACEHOLDER: these values have not been validated against Quasar hardware.
# They are Blackhole's values, with NoC-bound quantities scaled 4x for
# Quasar's 2048-bit NoC (Blackhole's is 512-bit). The transfer bandwidth table
# scales both packet size and bandwidth, assuming efficiency depends on flit
# count. DRAM/ETH rates and all latencies are unscaled Blackhole values.

link_bandwidth: 243.6
eth_bandwidth_per_link: 50.0
dram_channels_per_controller: 1

injection_rates:
  WORKER: 243.6
  DRAM: 40.0
  ETH: 999.9
  UNDEF: 243.6

absorption_rates:
  WORKER: 243.6
  DRAM: 40.0
  ETH: 999.9
  UNDEF: 243.6

transfer_bandwidth_table:
  - [0, 0.0]
  - [512, 24.0]
  - [1024, 48.4]
  - [2048, 96.8]
  - [4096, 192.0]
  - [8192, 230.8]
  - [16384, 234.8]
  - [32768, 241.6]
  - [65536, 243.6]

latencies:
  read:
    same_tile: 65
    same_col: 177
    same_row: 217
    diagonal: 329
  write:
    startup: 40
    cycles_per_hop: 11
